<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BAD-NES Emulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b0d10;--panel:#15181c;--fg:#d7dde3;--accent:#5ee0a3;--warn:#ff5f6d;--mono:'Consolas','Courier New',monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);margin:0;padding:14px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{color:var(--accent);font-size:20px;margin:0}
.sub{color:#8b95a1;font-size:12px;margin:2px 0 14px;text-align:center}
#wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:520px}
#screenBox{background:#000;border:2px solid #2a2f36;image-rendering:pixelated;width:100%;max-width:400px;border-radius:4px;overflow:hidden}
canvas#nes{image-rendering:pixelated;width:100%;height:auto;aspect-ratio:256/240;display:block}
#dropBtn{display:block;width:100%;max-width:400px;border:2px dashed #3a4048;padding:16px;border-radius:10px;margin-bottom:4px;font-size:14px;color:var(--fg);background:#15181c;text-align:center;cursor:pointer}
#dropBtn .big{font-size:22px;display:block;margin-bottom:4px}
#dropBtn.over{border-color:var(--accent);color:var(--accent)}
#fileInput{display:none}
.panel{background:var(--panel);border:1px solid #262b31;border-radius:6px;padding:12px;font-size:12px;width:100%;max-width:400px}
.row{display:flex;justify-content:space-between;gap:6px;margin:2px 0}
label{display:block;margin:8px 0 3px;color:#8b95a1}
input[type=range]{width:100%;height:26px}
button{background:#20262d;color:var(--fg);border:1px solid #363c44;border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;margin:2px 2px 2px 0}
button:hover{border-color:var(--accent)}
#toggleSettings{width:100%;max-width:400px;padding:10px;font-size:13px;text-align:center;background:#15181c;border-radius:8px}
.panel.collapsed{display:none}
@media (min-width:700px){ .panel.collapsed{display:block} #toggleSettings{display:none} #wrap{flex-direction:row;align-items:flex-start;max-width:900px} #screenBox,canvas#nes{max-width:512px} }
#debug{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,6,8,.95);color:#9effc7;font-size:11px;padding:16px;overflow:auto;display:none;z-index:99}
#debug.show{display:block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dbox{border:1px solid #263028;padding:8px;border-radius:4px}
.dbox h3{margin:0 0 6px;color:var(--warn);font-size:12px}
#status{font-size:11px;color:#8b95a1;margin-top:6px}
.val{color:var(--accent)}
#touchControls{display:flex;justify-content:space-between;align-items:center;margin-top:4px;width:100%;max-width:400px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:2px}
.dpad button{grid-column:auto;background:#20262d;border:1px solid #363c44;border-radius:6px;color:var(--fg);font-size:16px;touch-action:none}
.dpad button.pressed{background:var(--accent);color:#06130c}
#btnUp{grid-area:1/2} #btnLeft{grid-area:2/1} #btnRight{grid-area:2/3} #btnDown{grid-area:3/2}
.dpad{grid-template-areas:". u ." "l . r" ". d ."}
#btnUp{grid-area:u}#btnLeft{grid-area:l}#btnRight{grid-area:r}#btnDown{grid-area:d}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.ab{display:flex;gap:10px}
.ab button{width:58px;height:58px;border-radius:50%;background:#20262d;border:1px solid #363c44;color:var(--fg);font-size:16px;font-weight:bold;touch-action:none}
.ab button.pressed{background:var(--accent);color:#06130c}
.ss{display:flex;gap:8px}
.ss button{padding:6px 10px;border-radius:14px;background:#20262d;border:1px solid #363c44;color:var(--fg);font-size:10px;touch-action:none}
.ss button.pressed{background:var(--accent);color:#06130c}
#touchF3{background:#2d2320;border:1px solid #4a332b;color:var(--warn);border-radius:6px;padding:6px 10px;font-size:11px}
@media (min-width:700px){ #touchControls{display:none} }
</style></head>

<script>
// ===================== BUS / MEMORY =====================
const RAM = new Uint8Array(0x800);
let PRG=null, CHR=null, CHRram=null, mapper=0, prgBanks=1, chrBanks=1, mirroring=0, hasBattery=false;
let controllerLatch=[0,0], controllerShift=[0,0], controllerState=[0,0];
let stickyMask=[0,0];

const badness = {cpuErr:1, spriteJit:8, palCorrupt:2, pixelNoise:2, tear:3, scanGlitch:3, spriteFlicker:8, ctrlStick:1, frameSkip:2};
function pct(p){return Math.random()*100 < p;}

// ===================== PPU =====================
const VRAM = new Uint8Array(0x800); // nametables
const PAL = new Uint8Array(32);
const OAM = new Uint8Array(256);
let ppuCtrl=0, ppuMask=0, ppuStatus=0, oamAddr=0;
let vramAddr=0, tempAddr=0, fineX=0, writeToggle=0, ppuDataBuf=0;
let scanline=0, ppuCycle=0, frameOdd=0, nmiOccurred=false;
let ppuDebug = {noSprites:false, noBg:false};

function mirrorNT(addr){
  addr &= 0xFFF;
  const table = addr >> 10, off = addr & 0x3FF;
  let bank;
  if(mirroring===0) bank = (table===0||table===2)?0:1; // horizontal
  else if(mirroring===1) bank = (table===0||table===1)?0:1; // vertical
  else bank = table; // four-screen approx (only 2 banks avail, wraps)
  return ((bank&1)*0x400)+off;
}
function ppuReadVRAM(addr){
  addr &= 0x3FFF;
  if(addr<0x2000){ return CHR?CHR[addr%CHR.length]:(CHRram?CHRram[addr]:0); }
  if(addr<0x3F00) return VRAM[mirrorNT(addr)];
  addr &= 0x1F; if(addr>=16 && (addr%4)===0) addr-=16;
  return PAL[addr];
}
function ppuWriteVRAM(addr,val){
  addr &= 0x3FFF;
  if(addr<0x2000){ if(CHRram) CHRram[addr]=val; return; }
  if(addr<0x3F00){ VRAM[mirrorNT(addr)]=val; return; }
  addr &= 0x1F; if(addr>=16 && (addr%4)===0) addr-=16;
  PAL[addr]=val;
}
function ppuRegRead(reg){
  switch(reg){
    case 2:{ let v=ppuStatus; ppuStatus &= 0x7F; writeToggle=0; return v; }
    case 4: return OAM[oamAddr];
    case 7:{
      let addr=vramAddr&0x3FFF, val;

function ppuRegWrite(reg,val){
  switch(reg){
    case 0: ppuCtrl=val; tempAddr=(tempAddr&0xF3FF)|((val&3)<<10); break;
    case 1: ppuMask=val; break;
    case 3: oamAddr=val; break;
    case 4: OAM[oamAddr]=val; oamAddr=(oamAddr+1)&0xFF; break;
    case 5:
      if(!writeToggle){ fineX=val&7; tempAddr=(tempAddr&0xFFE0)|(val>>3); writeToggle=1; }

// full-frame renderer (not cycle-accurate on purpose -- BAD-NES!)
const frameBuf = new Uint8ClampedArray(256*240*4);
const NES_PAL = [0x666666,0x002A88,0x1412A7,0x3B00A4,0x5C007E,0x6E0040,0x6C0600,0x561D00,0x333500,0x0B4800,0x005200,0x004F08,0x00404D,0,0,0,
0xADADAD,0x155FD9,0x4240FF,0x7527FE,0xA01ACC,0xB71E7B,0xB53120,0x994E00,0x6B6D00,0x388700,0x0C9300,0x008F32,0x007C8D,0,0,0,
0xFFFEFF,0x64B0FF,0x9290FF,0xC676FF,0xF36AFF,0xFE6ECC,0xFE8170,0xEA9E22,0xBCBE00,0x88D800,0x5CE430,0x45E082,0x48CDDE,0x4F4F4F,0,0,
0xFFFEFF,0xC0DFFF,0xD3D2FF,0xE8C8FF,0xFBC2FF,0xFEC4EA,0xFECCC5,0xF7D8A5,0xE4E594,0xCFEF96,0xBDF4AB,0xB3F3CC,0xB5EBF2,0xB8B8B8,0,0];

function renderFrame(){
  if(pct(badness.frameSkip)) return; // random frame skip: just don't redraw (glitch)
  for(let y=0;y<240;y++){
    let rowOffset = 0;
    if(pct(badness.tear)) rowOffset = (Math.random()*40-20)|0; // horizontal tear
    for(let x=0;x<256;x++){
      let sx=(x+rowOffset)&0xFF;
      let bg = getBgPixel(sx,y);
      let sp = getSpritePixel(sx,y,bg.opaque);
      let colorIdx = sp && sp.opaque ? sp.pixel : bg.pixel;
      if(pct(badness.palCorrupt)) colorIdx = (colorIdx + ((Math.random()*64)|0)) & 0x3F;
      let rgb = NES_PAL[colorIdx&0x3F]||0;
      let i=(y*256+x)*4;
      let jitterY = pct(badness.scanGlitch) ? y : y; // reserved
      if(pct(badness.pixelNoise)){ rgb = (Math.random()*0xFFFFFF)|0; }
      frameBuf[i]=(rgb>>16)&0xFF; frameBuf[i+1]=(rgb>>8)&0xFF; frameBuf[i+2]=rgb&0xFF; frameBuf[i+3]=255;
    }
  }
  const ctx = nesCanvas.getContext('2d');
  const imgData = new ImageData(frameBuf.slice(),256,240);
  ctx.putImageData(imgData,0,0);
}
function getBgPixel(x,y){
  if(ppuDebug.noBg || !(ppuMask&8)) return {pixel:PAL[0],opaque:false};
  let baseNtX=(tempAddr>>10)&1, baseNtY=(tempAddr>>11)&1;
  let coarseX=tempAddr&0x1F, coarseY=(tempAddr>>5)&0x1F, fineY=(tempAddr>>12)&7;
  let scrollX = baseNtX*256 + coarseX*8 + fineX;
  let scrollY = baseNtY*240 + coarseY*8 + fineY;
  let gx=(x+scrollX)%512, gy=(y+scrollY)%480;
  let ntX=(gx>>8)&1, ntY=gy>=240?1:0;
  let tx=(gx&0xFF)>>3, ty=(gy%240)>>3;
  let table = ntX|(ntY<<1); // 0..3, mapped through mirroring in mirrorNT
  let base = 0x2000 + table*0x400;
  let ntAddr = base + (tx + ty*32);
  let tileIdx = ppuReadVRAM(ntAddr);
  let attrAddr = base + 0x3C0 + ((ty>>2)*8 + (tx>>2));
  let attr = ppuReadVRAM(attrAddr);
  let shift = ((ty&2)?4:0) + ((tx&2)?2:0);
  let paletteNum = (attr>>shift)&3;
  let patBase = (ppuCtrl&0x10)?0x1000:0;
  let fineYp = (gy%240)&7, fineXp = gx&7;
  let lo = ppuReadVRAM(patBase + tileIdx*16 + fineYp);
  let hi = ppuReadVRAM(patBase + tileIdx*16 + fineYp+8);
  let bit = 7-fineXp;
  let colorBit = (((hi>>bit)&1)<<1) | ((lo>>bit)&1);
  if(colorBit===0) return {pixel:PAL[0],opaque:false};
  return {pixel:PAL[paletteNum*4+colorBit], opaque:true};
}
function getSpritePixel(x,y,bgOpaque){
  if(ppuDebug.noSprites || !(ppuMask&0x10)) return null;
  for(let s=0;s<64;s++){
    let base=s*4;
    let sy=OAM[base], tile=OAM[base+1], attr=OAM[base+2], sx=OAM[base+3];
    let jx = pct(badness.spriteJit) ? ((Math.random()*6-3)|0) : 0;
    let jy = pct(badness.spriteJit) ? ((Math.random()*6-3)|0) : 0;
    sx+=jx; sy+=jy;
    if(x<sx||x>=sx+8||y<sy+1||y>=sy+9) continue;
    if(pct(badness.spriteFlicker) && Math.random()<0.5) continue; // missing sprite
    let px=x-sx, py=y-sy-1;
    if(attr&0x40) px=7-px; if(attr&0x80) py=7-py;
    let patBase=(ppuCtrl&8)?0x1000:0;
    let lo=ppuReadVRAM(patBase+tile*16+py), hi=ppuReadVRAM(patBase+tile*16+py+8);
    let bit=7-px; let colorBit=(((hi>>bit)&1)<<1)|((lo>>bit)&1);
    if(colorBit===0) continue;
    let pal=attr&3;
    return {pixel:PAL[16+pal*4+colorBit], opaque:true};
  }
  return null;
}

// ===================== CPU (6502) =====================
let A=0,X=0,Y=0,SP=0xFD,PC=0,P=0x24;
const FLAG={C:1,Z:2,I:4,D:8,B:16,U:32,V:64,N:128};
let cpuCycles=0, cpuPaused=false, totalInstr=0, curOpcode=0;
let pendingNMI=false, pendingIRQ=false;

function cpuRead(addr){
  addr&=0xFFFF;
  if(addr<0x2000) return RAM[addr&0x7FF];
  if(addr<0x4000) return ppuRegRead(addr&7);
  if(addr===0x4016||addr===0x4017){
    const p=addr-0x4016;
    let bit = (controllerShift[p]&1); controllerShift[p]>>=1;
    if(pct(badness.ctrlStick)) bit ^= (stickyMask[p]&1);
    return bit;
  }
  if(addr>=0x8000){
    let off=addr-0x8000;
    if(mapper===2){ // UxROM
      let bank = uxBank; if(off>=0x4000){ bank=prgBanks-1; off-=0x4000; }
      return PRG[(bank*0x4000+off)%PRG.length];
    }
    return PRG[off % PRG.length];
  }
  return 0;
}
let uxBank=0;
function cpuWrite(addr,val){
  addr&=0xFFFF;
  if(addr<0x2000){ RAM[addr&0x7FF]=val; return; }
  if(addr<0x4000){ ppuRegWrite(addr&7,val); return; }
  if(addr===0x4014){ // OAM DMA
    let base=val<<8;
    for(let i=0;i<256;i++) OAM[(oamAddr+i)&0xFF]=cpuRead(base+i);
    return;
  }
  if(addr===0x4016){
    if(val&1){ /* strobe */ }
    controllerShift[0]=controllerState[0]; controllerShift[1]=controllerState[1];
    return;
  }
  if(addr>=0x8000 && mapper===2){ uxBank = val % prgBanks; return; }
}
function setZN(v){ v&=0xFF; P = v===0 ? (P|FLAG.Z) : (P&~FLAG.Z); P = (v&0x80)?(P|FLAG.N):(P&~FLAG.N); return v; }
function push(v){ cpuWrite(0x100+SP,v); SP=(SP-1)&0xFF; }
function pop(){ SP=(SP+1)&0xFF; return cpuRead(0x100+SP); }
function resetCPU(){ A=0;X=0;Y=0;SP=0xFD;P=0x24; PC = cpuRead(0xFFFC)|(cpuRead(0xFFFD)<<8); cpuCycles=0; }

// addressing helpers -> return {addr, extra_cycle, isAcc}
function amImm(){ let a=PC; PC++; return a; }
function amZP(){ let a=cpuRead(PC); PC++; return a; }
function amZPX(){ let a=(cpuRead(PC)+X)&0xFF; PC++; return a; }
function amZPY(){ let a=(cpuRead(PC)+Y)&0xFF; PC++; return a; }
function amAbs(){ let a=cpuRead(PC)|(cpuRead(PC+1)<<8); PC+=2; return a; }
function amAbsX(){ let a=(cpuRead(PC)|(cpuRead(PC+1)<<8))+X; PC+=2; return a&0xFFFF; }
function amAbsY(){ let a=(cpuRead(PC)|(cpuRead(PC+1)<<8))+Y; PC+=2; return a&0xFFFF; }
function amIndX(){ let z=(cpuRead(PC)+X)&0xFF; PC++; return cpuRead(z)|(cpuRead((z+1)&0xFF)<<8); }
function amIndY(){ let z=cpuRead(PC); PC++; let a=cpuRead(z)|(cpuRead((z+1)&0xFF)<<8); return (a+Y)&0xFFFF; }
function amRel(){ let o=cpuRead(PC); PC++; return o<128?PC+o:PC+o-256; }

function branch(cond){ let t=amRel(); if(cond){ PC=t&0xFFFF; cpuCycles++; } }

function stepCPU(){

  if(pct(badness.cpuErr)){ op = (op + ((Math.random()*8)|0)) & 0xFF; } // corrupted opcode fetch
  totalInstr++;
  execOp(op);
}

    case 0xB0: branch(!!(P&FLAG.C)); cpuCycles+=2; break; // BCS
    case 0xF0: branch(!!(P&FLAG.Z)); cpuCycles+=2; break; // BEQ
    case 0xD0: branch(!(P&FLAG.Z)); cpuCycles+=2; break; // BNE
    case 0x10: branch(!(P&FLAG.N)); cpuCycles+=2; break; // BPL
    case 0x30: branch(!!(P&FLAG.N)); cpuCycles+=2; break; // BMI
    case 0x50: branch(!(P&FLAG.V)); cpuCycles+=2; break; // BVC
    case 0x70: branch(!!(P&FLAG.V)); cpuCycles+=2; break; // BVS
    case 0x18: P&=~FLAG.C; cpuCycles+=2; break; // CLC
    case 0x38: P|=FLAG.C; cpuCycles+=2; break; // SEC
    case 0x58: P&=~FLAG.I; cpuCycles+=2; break; // CLI
    case 0x78: P|=FLAG.I; cpuCycles+=2; break; // SEI
    case 0xB8: P&=~FLAG.V; cpuCycles+=2; break; // CLV
    case 0xD8: P&=~FLAG.D; cpuCycles+=2; break; // CLD
    case 0xF8: P|=FLAG.D; cpuCycles+=2; break; // SED
    case 0xEA: cpuCycles+=2; break; // NOP
    default: cpuCycles+=2; break; // unofficial/unimplemented opcode -> treat as NOP (adds to the badness!)
  }
}
function adc(v){ let sum=A+v+(P&FLAG.C?1:0); let ov=(~(A^v)&(A^sum)&0x80); P=ov?(P|FLAG.V):(P&~FLAG.V); P=sum>0xFF?(P|FLAG.C):(P&~FLAG.C); A=setZN(sum); }
function sbc(v){ adc(v^0xFF); }
function cmp(r,v){ let d=r-v; P=d>=0?(P|FLAG.C):(P&~FLAG.C); setZN(d); }
function aslV(v){ P=(v&0x80)?(P|FLAG.C):(P&~FLAG.C); return (v<<1)&0xFF; }
function lsrV(v){ P=(v&1)?(P|FLAG.C):(P&~FLAG.C); return v>>1; }
function rolV(v){ let c=P&FLAG.C?1:0; P=(v&0x80)?(P|FLAG.C):(P&~FLAG.C); return ((v<<1)|c)&0xFF; }
function rorV(v){ let c=P&FLAG.C?0x80:0; P=(v&1)?(P|FLAG.C):(P&~FLAG.C); return (v>>1)|c; }

// ===================== FRAME LOOP =====================
const CYCLES_TO_VBLANK=27384; // ~scanlines 0-240 (rendering phase, vblank flag clear)
const CYCLES_PER_FRAME=29780; // vblank phase runs to here (flag set, NMI can fire)
let running=false;
function runFrame(){
  if(cpuPaused) return;
  cpuCycles=0;
  ppuStatus &= ~0xE0; // clear vblank, sprite0-hit, overflow at start of frame (pre-render line)
  let guard=0;
  let renderingOn = (ppuMask&0x18)===0x18;
  let s0Scanline = OAM[0]+1; // sprite 0's top row
  let s0CycleThreshold = (renderingOn && s0Scanline>0 && s0Scanline<240) ? s0Scanline*113.667 : Infinity;
  let s0Fired=false;
  while(cpuCycles<CYCLES_TO_VBLANK && guard++<200000){
    stepCPU();
    if(!s0Fired && cpuCycles>=s0CycleThreshold){ ppuStatus|=0x40; s0Fired=true; }
  }
  ppuStatus |= 0x80; // vblank starts here -- CPU can now observe it via $2002 polling
  if(ppuCtrl&0x80) pendingNMI=true;
  guard=0;
  while(cpuCycles<CYCLES_PER_FRAME && guard++<200000) stepCPU();
  renderFrame();
}
let romLoaded=false;
function frameLoop(){
  if(romLoaded) runFrame();
  updateDebugPanels();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

// ===================== ROM LOADING =====================
function loadROM(bytes){
  if(bytes[0]!==0x4E||bytes[1]!==0x45||bytes[2]!==0x53||bytes[3]!==0x1A){ alert('Not a valid iNES ROM'); return; }
  prgBanks=bytes[4]; chrBanks=bytes[5];
  let flags6=bytes[6];
  mirroring = flags6&1; // 0=horiz,1=vert (approx)
  hasBattery=!!(flags6&2);
  mapper=(flags6>>4)|(bytes[7]&0xF0);
  if(![0,1,2,3].includes(mapper)) { console.warn('mapper '+mapper+' not fully supported, treating as NROM (bonus glitches!)'); }
  let off=16;
  if(flags6&4) off+=512; // trainer
  PRG = bytes.slice(off, off+prgBanks*16384);
  off += prgBanks*16384;
  if(chrBanks>0){ CHR = bytes.slice(off, off+chrBanks*8192); CHRram=null; }
  else { CHR=null; CHRram=new Uint8Array(0x2000); }
  romLoaded=true;
  resetCPU();
  document.getElementById('status').textContent = `ROM loaded — mapper ${mapper}, PRG ${prgBanks*16}KB, CHR ${chrBanks*8}KB, mirroring ${mirroring?'vertical':'horizontal'}`;
  document.getElementById('romInfo').innerHTML = `mapper: ${mapper}<br>PRG: ${prgBanks*16}KB<br>CHR: ${chrBanks*8}KB<br>mirror: ${mirroring?'V':'H'}`;
}
document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  f.arrayBuffer().then(buf=>loadROM(new Uint8Array(buf)));
});
const dropZone=document.getElementById('dropBtn');
dropZone.addEventListener('dragover', e=>{e.preventDefault(); dropZone.classList.add('over');});
dropZone.addEventListener('dragleave', ()=>dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e=>{
  e.preventDefault(); dropZone.classList.remove('over');
  const f=e.dataTransfer.files[0]; if(!f) return;
  f.arrayBuffer().then(buf=>loadROM(new Uint8Array(buf)));
});
document.getElementById('toggleSettings').addEventListener('click',()=>{
  document.getElementById('settingsPanel').classList.toggle('collapsed');
});
document.getElementById('resetBtn').onclick=()=>{ if(romLoaded) resetCPU(); };
document.getElementById('ejectBtn').onclick=()=>{ romLoaded=false; PRG=null; CHR=null; document.getElementById('status').textContent='ROM ejected.'; };

// ===================== CONTROLS =====================
const nesCanvas=document.getElementById('nes');
const KEYMAP={ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',KeyZ:'A',KeyX:'B',Enter:'Start',ShiftRight:'Select'};
const BIT={A:0x01,B:0x02,Select:0x04,Start:0x08,Up:0x10,Down:0x20,Left:0x40,Right:0x80};
function setButton(name,down){
  const bitFor=BIT[name]; if(bitFor===undefined) return;
  if(down) controllerState[0]|=bitFor; else controllerState[0]&=~bitFor;
  if(down && pct(badness.ctrlStick)) stickyMask[0]|=bitFor;
}
function setBtn(code,down){ const name=KEYMAP[code]; if(name) setButton(name,down); }
window.addEventListener('keydown', e=>{
  if(e.code==='F3'){ e.preventDefault(); document.getElementById('debug').classList.toggle('show'); return; }
  setBtn(e.code,true);
});
window.addEventListener('keyup', e=>setBtn(e.code,false));

// ---- touch controls (Android / touchscreen) ----
document.querySelectorAll('[data-btn]').forEach(el=>{
  const name=el.getAttribute('data-btn');
  const down=ev=>{ ev.preventDefault(); setButton(name,true); el.classList.add('pressed'); };
  const up=ev=>{ ev.preventDefault(); setButton(name,false); el.classList.remove('pressed'); };
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',down);
  el.addEventListener('mouseup',up);
  el.addEventListener('mouseleave',up);
});
document.getElementById('touchF3').addEventListener('click',()=>document.getElementById('debug').classList.toggle('show'));

// ===================== BADNESS SLIDER WIRING =====================
function wireSlider(id,label,key){
  const el=document.getElementById(id), lab=document.getElementById(label);
  el.addEventListener('input',()=>{ badness[key]=+el.value; lab.textContent=el.value+'%'; });
}
wireSlider('cpuErr','v_cpu','cpuErr');
wireSlider('spriteJit','v_jit','spriteJit');
wireSlider('palCorrupt','v_pal','palCorrupt');
wireSlider('pixelNoise','v_noise','pixelNoise');
wireSlider('tear','v_tear','tear');
wireSlider('scanGlitch','v_scan','scanGlitch');
wireSlider('spriteFlicker','v_flick','spriteFlicker');
wireSlider('ctrlStick','v_stick','ctrlStick');
wireSlider('frameSkip','v_fs','frameSkip');

// ===================== DEBUG MENU =====================
function hex(n,d){ return '$'+n.toString(16).toUpperCase().padStart(d,'0'); }
function updateDebugPanels(){
  if(!document.getElementById('debug').classList.contains('show')) return;
  document.getElementById('cpuInfo').innerHTML =
    `PC: ${hex(PC,4)}<br>A: ${hex(A,2)} X: ${hex(X,2)} Y: ${hex(Y,2)}<br>SP: ${hex(SP,2)} P: ${hex(P,2)}<br>Opcode: ${hex(curOpcode,2)}<br>Cycles: ${cpuCycles}<br>Instructions: ${totalInstr}`;
  document.getElementById('ppuInfo').innerHTML =
    `Scanline: ${scanline}<br>VRAM addr: ${hex(vramAddr,4)}<br>Temp addr: ${hex(tempAddr,4)}<br>Fine X: ${fineX}<br>STATUS: ${hex(ppuStatus,2)}<br>CTRL: ${hex(ppuCtrl,2)}<br>MASK: ${hex(ppuMask,2)}`;
}
document.getElementById('dPause').onclick=()=>{cpuPaused=!cpuPaused;};
document.getElementById('dStep').onclick=()=>{ if(romLoaded){cpuPaused=true; stepCPU(); renderFrame();} };
document.getElementById('dResetCpu').onclick=()=>{ if(romLoaded) resetCPU(); };
document.getElementById('dRandReg').onclick=()=>{ A=(Math.random()*256)|0; X=(Math.random()*256)|0; Y=(Math.random()*256)|0; };
document.getElementById('dCorruptStack').onclick=()=>{ for(let i=0;i<8;i++) RAM[0x100+((SP+i)&0xFF)]=(Math.random()*256)|0; };
document.getElementById('dSkip').onclick=()=>{ PC=(PC+1)&0xFFFF; };
document.getElementById('dCorruptVram').onclick=()=>{ for(let i=0;i<64;i++) VRAM[(Math.random()*VRAM.length)|0]=(Math.random()*256)|0; };
document.getElementById('dCorruptNt').onclick=()=>{ for(let i=0;i<32;i++) VRAM[(Math.random()*0x400)|0]=(Math.random()*256)|0; };
document.getElementById('dCorruptPal').onclick=()=>{ for(let i=0;i<32;i++) PAL[i]=(Math.random()*64)|0; };
document.getElementById('dRandScroll').onclick=()=>{ tempAddr=(Math.random()*0x7FFF)|0; fineX=(Math.random()*8)|0; };
document.getElementById('dNoSprites').onclick=()=>{ ppuDebug.noSprites=!ppuDebug.noSprites; };
document.getElementById('dNoBg').onclick=()=>{ ppuDebug.noBg=!ppuDebug.noBg; };
function memPreset(fn){ if(!romLoaded) return; fn(); }
document.getElementById('mTiny').onclick=()=>memPreset(()=>{ RAM[(Math.random()*RAM.length)|0]^=1<<((Math.random()*8)|0); });
document.getElementById('mOops').onclick=()=>memPreset(()=>{ for(let i=0;i<16;i++) RAM[(Math.random()*RAM.length)|0]=(Math.random()*256)|0; });
document.getElementById('mStroke').onclick=()=>memPreset(()=>{ for(let i=0;i<128;i++) RAM[(Math.random()*RAM.length)|0]=(Math.random()*256)|0; for(let i=0;i<16;i++) VRAM[(Math.random()*VRAM.length)|0]=(Math.random()*256)|0; });
document.getElementById('mCooked').onclick=()=>memPreset(()=>{ for(let i=0;i<RAM.length;i++) if(Math.random()<0.3) RAM[i]=(Math.random()*256)|0; for(let i=0;i<PAL.length;i++) PAL[i]=(Math.random()*64)|0; });
</script>
